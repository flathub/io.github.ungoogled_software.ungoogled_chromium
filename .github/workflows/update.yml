name: Update Ungoogled Chromium

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-ungoogled-chromium
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Manual runs should also propose updates against the default branch.
          ref: ${{ github.event.repository.default_branch }}

      - name: Check for a ready upstream release
        id: release
        run: python3 .github/scripts/check-update.py

      - name: Update sources and toolchains
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
          UC_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash make-new-release.sh "$VERSION" "$UC_COMMIT"

      - name: Open or update release pull request
        if: steps.release.outputs.version != ''
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: upd
          base: ${{ github.event.repository.default_branch }}
          title: Update Ungoogled Chromium to ${{ steps.release.outputs.version }}
          body: ''
