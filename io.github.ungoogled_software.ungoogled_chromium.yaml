app-id: io.github.ungoogled_software.ungoogled_chromium
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
base: org.chromium.Chromium.BaseApp
base-version: '26.08'
command: chromium
finish-args:
  - --require-version=1.8.2
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=cups
  - --socket=pcsc # FIDO2
  - --socket=pulseaudio
  - --socket=x11
  - --socket=wayland
  - --allow=bluetooth # FIDO2 CTAP hybrid transport
  - --system-talk-name=org.bluez
  - --system-talk-name=org.freedesktop.Avahi
  - --system-talk-name=org.freedesktop.UPower
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.gnome.Mutter.IdleMonitor.*
  - --talk-name=org.cinnamon.ScreenSaver
  - --talk-name=org.mate.ScreenSaver
  - --talk-name=org.xfce.ScreenSaver
  - --own-name=org.mpris.MediaPlayer2.chromium.*
  - --filesystem=/run/.heim_org.h5l.kcm-socket
  - --filesystem=xdg-run/pipewire-0
  # To install a PWA application
  - --filesystem=home/.local/share/applications:create
  - --filesystem=home/.local/share/icons:create
  # To allow installing shortcuts on the desktop
  - --filesystem=xdg-desktop
  # For default download directory to work as expected
  - --filesystem=xdg-download
  # For MPRIS media cover art
  - --filesystem=/tmp
  # For imported CA certificates
  - --persist=.pki
  # For GNOME proxy resolution
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
  - --env=GIO_EXTRA_MODULES=/app/lib/gio/modules
  - --env=GSETTINGS_BACKEND=dconf
  # For KDE proxy resolution (KDE5 only)
  - --filesystem=~/.config/kioslaverc

add-extensions:
  io.github.ungoogled_software.ungoogled_chromium.NativeMessagingHost:
    version: '1'
    directory: chromium/native-messaging-hosts
    merge-dirs: native-messaging-hosts
    subdirectories: true
    no-autodownload: true
    autodelete: true

  io.github.ungoogled_software.ungoogled_chromium.Extension:
    version: '1'
    directory: chromium/extensions
    merge-dirs: extensions;native-messaging-hosts;policies/managed;policies/recommended
    subdirectories: true
    no-autodownload: true
    autodelete: true

  io.github.ungoogled_software.ungoogled_chromium.Policy:
    version: '1'
    directory: chromium/policies
    merge-dirs: policies/managed;policies/recommended
    subdirectories: true
    no-autodownload: true
    autodelete: true

build-options:
  env:
    # flatpak-builder mounts its persistent cache here, including without --ccache.
    SCCACHE_DIR: /run/ccache/sccache
    # Flathub drops caches above 18 GiB. sccache 0.18 budgets the object and
    # preprocessor caches separately: 7 GiB each leaves 4 GiB of headroom.
    SCCACHE_CACHE_SIZE: 7G
    # Do not let Flatpak's optional ccache shims refill the legacy cache.
    CCACHE_DISABLE: '1'
    RUSTC_WRAPPER: /app/libexec/sccache
    CARGO_INCREMENTAL: '0'
    CMAKE_C_COMPILER_LAUNCHER: /app/bin/sccache
    CMAKE_CXX_COMPILER_LAUNCHER: /app/bin/sccache
    CC: /app/bin/cc
    CXX: /app/bin/c++

modules:
  - name: sccache
    buildsystem: simple
    build-commands:
      - install -Dm755 sccache /app/libexec/sccache-bin/sccache
      - install -Dm755 sccache.sh /app/bin/sccache
      - install -Dm755 rustc-sysroot-cache.py /app/libexec/sccache
      - install -Dm755 compiler-cache.sh /app/libexec/compiler-cache
      - for compiler in cc c++ gcc g++ clang clang++; do ln -s ../libexec/compiler-cache /app/bin/$compiler; done
      - /app/bin/sccache --show-stats
    cleanup:
      - /bin/sccache
      - /bin/cc
      - /bin/c++
      - /bin/gcc
      - /bin/g++
      - /bin/clang
      - /bin/clang++
      - /libexec/compiler-cache
      - /libexec/sccache
      - /libexec/sccache-bin
    sources:
      - type: archive
        url: https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz
        sha256: 45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mozilla/sccache/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: >-
            .assets[] | select(.name == "sccache-v" + $version + "-x86_64-unknown-linux-musl.tar.gz")
            | .browser_download_url
          timestamp-query: .published_at
      - type: archive
        url: https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-aarch64-unknown-linux-musl.tar.gz
        sha256: 2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a
        only-arches:
          - aarch64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mozilla/sccache/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: >-
            .assets[] | select(.name == "sccache-v" + $version + "-aarch64-unknown-linux-musl.tar.gz")
            | .browser_download_url
          timestamp-query: .published_at
      - type: file
        path: build-steps/compiler-cache.sh
      - type: file
        path: build-steps/rustc-sysroot-cache.py
      - type: file
        path: build-steps/sccache.sh

  - toolchains/google.json
  - toolchains/llvm.json
  - toolchains/rust.json
  - toolchains/build-tools.json

  - name: extensions
    buildsystem: simple
    build-commands:
      - mkdir -pv "${FLATPAK_DEST}"/chromium/{extensions,native-messaging-hosts,policies}
      - for dir in native-messaging-hosts policies; do ln -sfv "${FLATPAK_DEST}/chromium/"{"${dir}",extensions}"/${dir}";
        done
      - touch "${FLATPAK_DEST}/chromium/extensions/no-mount-stamp"

  - name: dconf
    buildsystem: meson
    config-opts:
      - -Dbash_completion=false
      - -Dman=false
      - -Dvapi=false
    cleanup:
      - /etc
      - /include
      - ca.desrt.dconf.service
      - dconf.service
      - dconf-service
      - '*.pc'
    sources:
      - type: archive
        url: https://download.gnome.org/sources/dconf/51/dconf-51.0.tar.xz
        sha256: e65c1b7867f836faad9f9ee04acf5c5a6cae2bbc784833fe093207e0cb590248
        x-checker-data:
          type: gnome
          name: dconf
          stable-only: true
      - patches/dconf/_sources.json

  - name: chromium
    buildsystem: simple
    build-commands:
      - bash build-steps/build.sh
      - bash build-steps/0070-install.sh
    sources:
      - type: git
        url: https://github.com/ungoogled-software/ungoogled-chromium
        commit: dfd7c50244e82b8e306350bfa1353cb152c5d037
        dest: uc
      - patches/ungoogled-chromium/_sources.json
      - type: archive
        url: https://github.com/chromium-linux-tarballs/chromium-tarballs/releases/download/154.0.8037.92/chromium-154.0.8037.92-linux.tar.xz
        sha256: 5c21ef0ab5829a54bf62c39c6cef7a816c9edf55a2442b623a161ec6fa336e37
      - patches/chromium/_sources.json
      - patches/chromium-local/_sources.json
      - type: file
        path: io.github.ungoogled_software.ungoogled_chromium.desktop
      - type: file
        path: io.github.ungoogled_software.ungoogled_chromium.metainfo.xml
      - type: file
        path: chromium.sh
      - type: file
        path: cobalt.ini
      - type: dir
        path: build-steps/chromium
        dest: build-steps
      - type: dir
        path: branding/to_copy
