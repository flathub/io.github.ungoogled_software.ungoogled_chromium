modules:
  - name: sccache
    buildsystem: simple
    build-commands:
      - install -Dm755 sccache /app/bin/sccache
    cleanup:
      - /bin/sccache
    sources:
      - type: archive
        url: https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz
        sha256: 45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mozilla/sccache/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: >-
            .assets[] | select(.name == "sccache-v" + $version + "-x86_64-unknown-linux-musl.tar.gz")
            | .browser_download_url
          timestamp-query: .published_at
      - type: archive
        url: https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-aarch64-unknown-linux-musl.tar.gz
        sha256: 2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a
        only-arches:
          - aarch64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mozilla/sccache/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: >-
            .assets[] | select(.name == "sccache-v" + $version + "-aarch64-unknown-linux-musl.tar.gz")
            | .browser_download_url
          timestamp-query: .published_at

  - name: readelf-symlink
    only-arches: [aarch64]
    buildsystem: simple
    build-commands:
      - ln -s /usr/bin/readelf /app/bin/aarch64-linux-gnu-readelf

  - name: extensions
    buildsystem: simple
    build-commands:
      - mkdir -pv "${FLATPAK_DEST}"/chromium/{extensions,native-messaging-hosts,policies}
      - for dir in native-messaging-hosts policies; do ln -sfv "${FLATPAK_DEST}/chromium/"{"${dir}",extensions}"/${dir}";
        done
      - touch "${FLATPAK_DEST}/chromium/extensions/no-mount-stamp"

  - name: dconf
    buildsystem: meson
    config-opts:
      - -Dbash_completion=false
      - -Dman=false
      - -Dvapi=false
    cleanup:
      - /etc
      - /include
      - ca.desrt.dconf.service
      - dconf.service
      - dconf-service
      - '*.pc'
    sources:
      - type: archive
        url: https://download.gnome.org/sources/dconf/51/dconf-51.0.tar.xz
        sha256: e65c1b7867f836faad9f9ee04acf5c5a6cae2bbc784833fe093207e0cb590248
        x-checker-data:
          type: gnome
          name: dconf
          stable-only: true
      - patches/dconf/_sources.json

  - name: esbuild
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    cleanup:
      - '*'
    build-commands:
      - install -Dm755 esbuild /app/lib/sdk/esbuild/bin/esbuild
    sources:
      - type: archive
        archive-type: zip
        url: *esbuild_x64_url
        sha256: *esbuild_x64_sha256
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        archive-type: zip
        url: *esbuild_arm64_url
        sha256: *esbuild_arm64_sha256
        strip-components: 0
        only-arches: [aarch64]

  - name: chromium
    buildsystem: simple
    build-options:
      # flatpak-builder mounts this module at /run/build/chromium.
      prepend-path: /run/build/chromium/_build_tools/llvm/bin:/run/build/chromium/_build_tools/rust/bin:/usr/lib/sdk/node24/bin:/run/build/chromium/_build_tools/go/bin:/usr/lib/sdk/openjdk21/bin
      env:
        # Cache Chromium's pinned compilers without flatpak-builder's ccache shims.
        SCCACHE_DIR: /run/ccache/sccache
        # Object and preprocessor caches each get 7 GiB, below Flathub's 18 GiB cap.
        SCCACHE_CACHE_SIZE: 7G
        CCACHE_DISABLE: '1'
        CC: /run/build/chromium/_build_tools/llvm/bin/clang
        CXX: /run/build/chromium/_build_tools/llvm/bin/clang++
        AR: /run/build/chromium/_build_tools/llvm/bin/llvm-ar
        JAVA_HOME: /usr/lib/sdk/openjdk21
        GOROOT: /run/build/chromium/_build_tools/go
        GOTOOLCHAIN: local
    build-commands:
      - ./bootstrap.sh
      - ./build.sh
      - ./install.sh
    sources:
      - type: archive
        url: *chromium_url
        sha256: *chromium_sha256
      - type: git
        url: https://github.com/ungoogled-software/ungoogled-chromium
        commit: *uc_commit
        dest: uc
      - patches/ungoogled-chromium/_sources.json
      # Stage binaries outside third_party so UGC pruning cannot remove them.
      - type: archive
        url: *llvm_prebuilt_x64_url
        sha256: *llvm_prebuilt_x64_sha256
        dest: _build_tools/llvm
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        url: *llvmobjdump_x64_url
        sha256: *llvmobjdump_x64_sha256
        dest: _build_tools/llvm
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        url: *rust_prebuilt_x64_url
        sha256: *rust_prebuilt_x64_sha256
        dest: _build_tools/rust
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        url: *libclang_x64_url
        sha256: *libclang_x64_sha256
        dest: _build_tools/libclang
        strip-components: 0
      - type: archive
        url: *llvm_prebuilt_arm64_url
        sha256: *llvm_prebuilt_arm64_sha256
        dest: _build_tools/llvm
        strip-components: 0
        only-arches: [aarch64]
      - type: archive
        url: *clang_format_arm64_url
        sha256: *clang_format_arm64_sha256
        dest: _build_tools/llvm
        strip-components: 0
        only-arches: [aarch64]
      - type: archive
        url: *rust_prebuilt_arm64_url
        sha256: *rust_prebuilt_arm64_sha256
        dest: _build_tools/rust
        strip-components: 0
        only-arches: [aarch64]
      - type: inline
        dest-filename: cr_build_revision
        contents: *clang_revision
        dest: _build_tools/llvm
      - type: shell
        commands:
          - ln -sf ../../rust/lib/libclang.so _build_tools/libclang/lib/libclang.so
          - ln -s llvm/bin/clang-format _build_tools/clang-format
        only-arches: [aarch64]
      - type: archive
        archive-type: zip
        url: *dawn_go_x64_url
        sha256: *dawn_go_x64_sha256
        strip-components: 0
        dest: _build_tools/go
        only-arches: [x86_64]
      - type: archive
        archive-type: zip
        url: *dawn_go_arm64_url
        sha256: *dawn_go_arm64_sha256
        strip-components: 0
        dest: _build_tools/go
        only-arches: [aarch64]
      - type: archive
        archive-type: zip
        url: *ts_x64_url
        sha256: *ts_x64_sha256
        strip-components: 0
        dest: _build_tools/typescript
      - type: archive
        url: *ts_arm64_url
        sha256: *ts_arm64_sha256
        dest: _build_tools/typescript-arm64
        only-arches: [aarch64]
      - type: file
        url: *clang_format_x64_url
        sha256: *clang_format_x64_sha256
        dest-filename: clang-format
        only-arches: [x86_64]
        dest: _build_tools
      - type: shell
        commands:
          - chmod +x _build_tools/clang-format
        only-arches: [x86_64]
      - type: shell
        commands:
          - install -m755 _build_tools/typescript-arm64/lib/tsc _build_tools/typescript/lib/tsc
        only-arches: [aarch64]
      - patches/chromium/_sources.json
      - patches/chromium-local/_sources.json
      - type: file
        path: io.github.ungoogled_software.ungoogled_chromium.desktop
      - type: file
        path: io.github.ungoogled_software.ungoogled_chromium.metainfo.xml
      - type: file
        path: chromium.sh
      - type: file
        path: cobalt.ini
      - type: dir
        path: build-aux
      - type: dir
        path: branding/to_copy
