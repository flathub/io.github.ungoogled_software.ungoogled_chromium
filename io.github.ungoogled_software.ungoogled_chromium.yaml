modules:
  - name: sccache
    buildsystem: simple
    build-commands:
      - install -Dm755 sccache /app/bin/sccache
    cleanup:
      - /bin/sccache
    sources:
      - type: archive
        url: https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-unknown-linux-musl.tar.gz
        sha256: aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mozilla/sccache/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: >-
            .assets[] | select(.name == "sccache-v" + $version + "-x86_64-unknown-linux-musl.tar.gz")
            | .browser_download_url
          timestamp-query: .published_at
      - type: archive
        url: https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-aarch64-unknown-linux-musl.tar.gz
        sha256: 3e47fc4a71b1ddd1b4294a0de9d34498922fdf41e3cd0bda5df3954e3d6deb9d
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/mozilla/sccache/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: >-
            .assets[] | select(.name == "sccache-v" + $version + "-aarch64-unknown-linux-musl.tar.gz")
            | .browser_download_url
          timestamp-query: .published_at

  - name: extensions
    buildsystem: simple
    build-commands:
      - mkdir -p /app/chromium/{extensions,native-messaging-hosts,policies}
      - for dir in native-messaging-hosts policies; do ln -s /app/chromium/{$dir,extensions}/$dir;
        done
      - touch /app/chromium/extensions/no-mount-stamp

  - name: dconf
    buildsystem: meson
    config-opts:
      - -Dbash_completion=false
      - -Dman=false
      - -Dvapi=false
    cleanup:
      - /etc
      - /include
      - ca.desrt.dconf.service
      - dconf.service
      - dconf-service
      - '*.pc'
    sources:
      - type: archive
        url: https://download.gnome.org/sources/dconf/51/dconf-51.0.tar.xz
        sha256: e65c1b7867f836faad9f9ee04acf5c5a6cae2bbc784833fe093207e0cb590248
        x-checker-data:
          type: gnome
          name: dconf
          stable-only: true
      - patches/dconf/_sources.json

  - name: esbuild
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    cleanup:
      - '*'
    build-commands:
      - mkdir -p /app/lib/sdk/esbuild
      - mv bin /app/lib/sdk/esbuild
    sources:
      - type: archive
        url: *esbuild_x64_url
        sha512: *esbuild_x64_sha512
        only-arches: [x86_64]
      - type: archive
        url: *esbuild_arm64_url
        sha512: *esbuild_arm64_sha512
        only-arches: [aarch64]

  - name: chromium
    buildsystem: simple
    build-options:
      env:
        # sccache caches the prebuilt Clang/Rust compilers next to
        # flatpak-builder's own ccache directory.
        SCCACHE_DIR: /run/ccache/sccache
        # Object and preprocessor caches each get 7 GiB, below Flathub's 18 GiB cap.
        SCCACHE_CACHE_SIZE: 7G
    build-commands:
      - ./bootstrap.sh
      - ./build.sh
      - ./install.sh
    sources:
      - type: archive
        url: *chromium_url
        sha256: *chromium_sha256
      - type: git
        url: https://github.com/ungoogled-software/ungoogled-chromium
        commit: *uc_commit
        dest: uc
      - patches/ungoogled-chromium/_sources.json
      # ungoogled-chromium's binary pruning deletes the bundled toolchain
      # directories, so the prebuilt tools are staged under _build_tools and
      # linked into place by bootstrap.sh after pruning.
      - type: archive
        url: *llvm_prebuilt_x64_url
        sha256: *llvm_prebuilt_x64_sha256
        dest: _build_tools/llvm
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        url: *llvm_prebuilt_arm64_url
        sha256: *llvm_prebuilt_arm64_sha256
        dest: _build_tools/llvm
        strip-components: 0
        only-arches: [aarch64]
      - type: file
        url: *clang_format_x64_url
        sha256: *clang_format_x64_sha256
        dest: _build_tools
        dest-filename: clang-format
        only-arches: [x86_64]
      - type: shell
        commands:
          - chmod +x _build_tools/clang-format
        only-arches: [x86_64]
      - type: archive
        url: *clang_format_arm64_url
        sha256: *clang_format_arm64_sha256
        dest: _clang-format-bin
        strip-components: 0
        only-arches: [aarch64]
      - type: shell
        commands:
          - mv _clang-format-bin/bin/clang-format _build_tools/
        only-arches: [aarch64]
      - type: archive
        url: *rust_prebuilt_x64_url
        sha256: *rust_prebuilt_x64_sha256
        dest: _build_tools/rust
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        url: *rust_prebuilt_arm64_url
        sha256: *rust_prebuilt_arm64_sha256
        dest: _build_tools/rust
        strip-components: 0
        only-arches: [aarch64]
      - type: archive
        url: *libclang_x64_url
        sha256: *libclang_x64_sha256
        dest: _build_tools/libclang
        strip-components: 0
      - type: shell
        commands:
          - cp _build_tools/rust/lib/libclang.so _build_tools/libclang/lib/
        only-arches: [aarch64]
      - type: archive
        archive-type: zip
        url: *dawn_go_x64_url
        sha256: *dawn_go_x64_sha256
        dest: _build_tools/go
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        archive-type: zip
        url: *dawn_go_arm64_url
        sha256: *dawn_go_arm64_sha256
        dest: _build_tools/go
        strip-components: 0
        only-arches: [aarch64]
      # Chromium's patched TypeScript package is used on both architectures,
      # with only the native tsc binary swapped on arm64.
      - type: archive
        archive-type: zip
        url: *ts_x64_url
        sha256: *ts_x64_sha256
        dest: _build_tools/typescript
        strip-components: 0
      - type: archive
        url: *ts_arm64_url
        sha256: *ts_arm64_sha256
        dest: _build_tools/typescript-arm64
        only-arches: [aarch64]
      - type: shell
        commands:
          - install -m755 _build_tools/typescript-arm64/lib/tsc _build_tools/typescript/lib/tsc
        only-arches: [aarch64]
      - patches/chromium/_sources.json
      - patches/chromium-local/_sources.json
